name: Facebook Automation CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Verify free Agent-Reach Web Search live
        if: ${{ startsWith(github.ref_name, 'feat/agent-reach-story-scout') }}
        run: |
          set -euo pipefail

          unset EXA_API_KEY
          npx --yes mcporter@0.14.2 list --http-url https://mcp.exa.ai/mcp --brief
          npx --yes mcporter@0.14.2 call --http-url https://mcp.exa.ai/mcp web_search_exa \
            --output json \
            --timeout 60000 \
            --args '{"query":"recent heartwarming act of kindness news","numResults":1}'

          echo "Live free Agent-Reach Web Search request completed without an API key."

      - name: Run tests
        run: npm test

      - name: Run production publisher in dry-run mode
        env:
          DRY_RUN: "true"
          FORCE_POST: "false"
        run: npm start

      - name: Validate workflow YAML
        run: |
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_file(f); puts "YAML OK: #{f}" }' .github/workflows/daily-facebook-post.yml .github/workflows/facebook-workflow-watchdog.yml .github/workflows/facebook-automation-ci.yml .github/workflows/a-little-better-fresh-news.yml

  live-watchdog-check:
    name: Live GitHub Actions API check
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify GitHub Actions API access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "Checking repository..."
          gh api "repos/${GITHUB_REPOSITORY}" --jq '.full_name'

          echo "Checking daily Facebook workflow..."
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-facebook-post.yml"             --jq '"enabled=(.state), path=(.path)"'

          echo "Checking recent daily workflow runs..."
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-facebook-post.yml/runs?per_page=5"             --jq '.workflow_runs[] | [.id, .event, .status, (.conclusion // "null"), .run_attempt] | @tsv'

          echo "Checking watchdog workflow..."
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/facebook-workflow-watchdog.yml"             --jq '"enabled=(.state), path=(.path)"'

          echo "Live GitHub Actions API check passed."
