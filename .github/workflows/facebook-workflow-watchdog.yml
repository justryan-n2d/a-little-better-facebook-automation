name: Facebook Workflow Watchdog

on:
  schedule:
    - cron: "15,45 * * * *"
      timezone: "Asia/Manila"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: a-little-better-facebook-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Facebook workflow watchdog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WATCHDOG_WORKFLOW_FILE: .github/workflows/daily-facebook-post.yml
          WATCHDOG_SCHEDULE_HOUR: "16"
          WATCHDOG_SCHEDULE_MINUTE: "0"
          WATCHDOG_GRACE_MINUTES: "60"
          WATCHDOG_MAX_ATTEMPTS: "3"
          WATCHDOG_NEWS_WORKFLOW_FILE: .github/workflows/a-little-better-fresh-news.yml
          WATCHDOG_NEWS_SCHEDULE_HOUR: "11"
          WATCHDOG_NEWS_SCHEDULE_MINUTE: "0"
          WATCHDOG_NEWS_GRACE_MINUTES: "60"
          WATCHDOG_NEWS_MAX_ATTEMPTS: "3"
          WATCHDOG_CONTENT_ALERT_THRESHOLDS: "5,2,0"
          WATCHDOG_TOKEN_ALERT_THRESHOLDS: "7,5,2,1,0"
          META_DATA_ACCESS_EXPIRES_AT: ${{ vars.META_DATA_ACCESS_EXPIRES_AT }}
        run: node src/watchdog.js
