name: Daily A Little Better Facebook Post

on:
  schedule:
    - cron: "0 9 * * *"
      timezone: "Asia/Manila"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate the post but do not publish to Facebook"
        required: false
        default: true
        type: boolean
      force_post:
        description: "Allow publishing even if today's date is already in history"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      META_GRAPH_VERSION: v26.0
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      FORCE_POST: ${{ github.event_name == 'workflow_dispatch' && inputs.force_post || false }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: npm test

      - name: Generate and publish
        run: npm start

      - name: Commit posting history
        if: ${{ success() && env.DRY_RUN != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posting-history.json
          git diff --cached --quiet || git commit -m "chore: record daily Facebook post"
          git push
