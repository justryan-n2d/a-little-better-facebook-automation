name: Daily A Little Better Facebook Post

run-name: A Little Better Facebook Post${{ github.event_name == 'repository_dispatch' && ' [watchdog recovery]' || '' }}

on:
  schedule:
    - cron: "0 16 * * *"
      timezone: "Asia/Manila"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate the post but do not publish to Facebook"
        required: false
        default: true
        type: boolean
      force_post:
        description: "Allow publishing even if today's date is already in history"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types:
      - facebook_watchdog_recovery

permissions:
  contents: read

concurrency:
  group: a-little-better-facebook-post
  cancel-in-progress: false

env:
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
  META_GRAPH_VERSION: v26.0
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
  FORCE_POST: ${{ github.event_name == 'workflow_dispatch' && inputs.force_post || false }}
  WATCHDOG_RECOVERY: ${{ github.event_name == 'repository_dispatch' }}
  SCHEDULED_RUN: ${{ github.event_name == 'schedule' }}

jobs:
  publish:
    outputs:
      did_publish: ${{ steps.publish_result.outputs.did_publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Generate and publish
        run: npm start

      - name: Read publish result
        id: publish_result
        if: ${{ always() }}
        run: |
          if [ -f artifacts/publish-status.json ]; then
            node -e 'const fs = require("fs"); const value = JSON.parse(fs.readFileSync("artifacts/publish-status.json", "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `did_publish=${value.published ? "true" : "false"}\n`);'
          else
            echo "did_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload dry-run image preview
        if: ${{ success() && env.DRY_RUN == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: a-little-better-image-preview
          path: artifacts/*.png
          if-no-files-found: error
          retention-days: 3

      - name: Upload posting state for record job
        if: ${{ always() && env.DRY_RUN != 'true' && steps.publish_result.outputs.did_publish == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: a-little-better-posting-state
          path: data
          if-no-files-found: error
          retention-days: 14

  record:
    needs: publish
    if: ${{ always() && needs.publish.outputs.did_publish == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download posting state
        uses: actions/download-artifact@v5
        with:
          name: a-little-better-posting-state
          path: .

      - name: Commit posting history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posting-history.json
          git diff --cached --quiet || git commit -m "chore: record daily Facebook post"
          git push
