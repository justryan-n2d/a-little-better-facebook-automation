name: A Little Better Agent-Reach Draft Preview

on:
  push:
    branches:
      - feat/agent-reach-story-scout

permissions:
  contents: read

jobs:
  draft-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Configure free Agent-Reach Web Search
        run: |
          npm install --global mcporter@0.14.2
          cat > "$RUNNER_TEMP/mcporter.json" <<'JSON'
          {
            "$schema": "https://raw.githubusercontent.com/openclaw/mcporter/main/mcporter.schema.json",
            "mcpServers": {
              "exa": {
                "description": "Agent-Reach Web Search using the free Exa MCP endpoint",
                "baseUrl": "https://mcp.exa.ai/mcp"
              }
            },
            "imports": []
          }
          JSON
          echo "MCPORTER_CONFIG=$RUNNER_TEMP/mcporter.json" >> "$GITHUB_ENV"
          unset EXA_API_KEY
          echo "Draft preview is configured with publishing disabled."

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate one real Fresh News draft
        env:
          NEWS_AUTO_PUBLISH: "false"
          NEWS_HISTORY_PATH: data/news-history.json
          STORY_SCOUT_MAX_QUERIES: "1"
        run: node src/news-post.js

      - name: Upload draft artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a-little-better-agent-reach-draft-preview
          path: |
            artifacts/fresh-news-*.png
            artifacts/fresh-news-*.json
            artifacts/fresh-news-status.json
            data/news-history.json
          if-no-files-found: error
          retention-days: 7
